<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A-count — Remote Office in Sofia</title>
<style>
  :root{
    --navy:#102a43;
    --navy-dark:#0a1c2e;
    --gold:#c9a24b;
    --gold-light:#e4c87d;
    --bg:#f5f6f8;
    --text:#1c2b3a;
    --muted:#5a6b7a; 
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .app{
    max-width:1100px;
    margin:0 auto;
    padding:24px 16px 60px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:18px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    color:var(--navy);
    font-size:1.1rem;
  }
  .brand .dot{
    width:12px;height:12px;border-radius:50%;
    background:var(--gold);
    display:inline-block;
  }
  .lang-switch{
    display:flex;
    gap:6px;
    background:#fff;
    border:1px solid #d9e2e8;
    border-radius:999px;
    padding:4px;
  }
  .lang-switch button{
    border:none;
    background:transparent;
    padding:7px 16px;
    border-radius:999px;
    font-weight:700;
    font-size:.85rem;
    color:var(--muted);
    cursor:pointer;
    transition:all .15s;
  }
  .lang-switch button.active{background:var(--navy);color:#fff;}
  .lang-switch button:hover:not(.active){background:#eef2f5;}
  .deck{position:relative;}
  .slide-wrap{
    background:#fff;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(16,42,67,.12);
    overflow:hidden;
    min-height:560px;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .slide{
    display:none;
    flex-direction:column;
    flex:1;
    padding:48px 56px;
    animation:fade .35s ease;
  }
  .slide.active{display:flex;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .eyebrow{
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:.75rem;
    font-weight:700;
    color:var(--gold);
    margin-bottom:10px;
  }
  .slide h2{
    font-size:1.85rem;
    color:var(--navy);
    margin:0 0 20px;
    font-weight:800;
    line-height:1.2;
  }
  .slide ul{list-style:none;padding:0;margin:0;flex:1;}
  .slide ul li{
    font-size:1.06rem;
    padding:10px 0 10px 28px;
    position:relative;
    color:var(--text);
    border-bottom:1px solid #eef2f5;
    line-height:1.5;
  }
  .slide ul li:last-child{border-bottom:none;}
  .slide ul li::before{
    content:"";
    position:absolute;
    left:0;top:19px;
    width:10px;height:10px;
    background:var(--gold);
    border-radius:3px;
  }
  .slide .footer-tag{
    margin-top:auto;
    padding-top:16px;
    font-size:.85rem;
    color:var(--muted);
    font-weight:600;
  }

  /* First slide: the complete multilingual image */
  .slide.title.active{
    display:flex;
    padding:0;
    background:#fff;
    color:#fff;
    align-items:center;
    justify-content:center;
  }
  .title-media{
    position:relative;
    width:100%;
    min-height:560px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
  }
  .title-media img{
    width:100%;
    height:auto;
    max-height:calc(100vh - 150px);
    object-fit:contain;
    display:block;
  }

  .slide.why{background:linear-gradient(180deg,#fff 0%,#faf6ec 100%);}
  .slide.why .eyebrow{color:var(--navy);}
  .slide.why h2{color:var(--gold);}
  .slide.patrimonium{background:linear-gradient(180deg,#fff 0%,#f0f4f8 100%);}
  .slide.patrimonium h2{color:var(--navy);}
  .slide.cta{background:var(--navy);color:#fff;}
  .slide.cta h2{color:#fff;}
  .slide.cta ul li{color:#dde6ec;border-bottom:1px solid rgba(255,255,255,.12);}
  .slide.cta ul li::before{background:var(--gold-light);}
  .cta-button{
    display:inline-block;
    margin-top:18px;
    background:var(--gold);
    color:#2a2007;
    font-weight:700;
    padding:12px 26px;
    border-radius:999px;
    text-decoration:none;
    width:fit-content;
    font-size:.95rem;
  }
  .cta-contact{margin-top:14px;font-size:.9rem;color:#aebccb;}
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .nav-top{
    flex:1 1 420px;
    margin:0 18px;
    min-width:320px;
  }
  .nav-bottom{
    margin-top:18px;
  }
  .nav button{
    background:#fff;
    border:1px solid #d9e2e8;
    color:var(--navy);
    font-weight:700;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    font-size:.9rem;
    transition:all .15s;
  }
  .nav button:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
  .nav button:disabled{opacity:.35;cursor:default;}
  .nav button:disabled:hover{background:#fff;color:var(--navy);}
  .dots{
    display:flex;gap:7px;flex-wrap:wrap;justify-content:center;
  }
  .dots span{
    width:9px;height:9px;border-radius:50%;
    background:#d9e2e8;cursor:pointer;transition:all .15s;
  }
  .dots span.active{background:var(--gold);transform:scale(1.3);}
  .counter{font-size:.85rem;color:var(--muted);min-width:60px;text-align:center;}


  @media (max-width:900px){
    .topbar .nav-top{
      order:3;
      flex-basis:100%;
      margin:0;
    }
  }

  @media (max-width:720px){
    .slide{padding:30px 26px;}
    .slide h2{font-size:1.35rem;}
    .slide ul li{font-size:.95rem;}
    .slide-wrap{min-height:0;}
    .slide.title.active{display:flex;padding:0;}
    .title-media{min-height:0;width:100%;}
    .title-media img{width:100%;height:auto;max-height:none;object-fit:contain;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><span class="dot"></span> A-count — Presentatie</div>

    <!-- Navigatie bovenaan, tussen titel en taalknoppen -->
    <div class="nav nav-top">
      <button class="prevBtn">← Vorige</button>
      <div class="dots dots-top"></div>
      <div class="counter"><span class="counterValue">1 / 11</span></div>
      <button class="nextBtn">Volgende →</button>
    </div>

    <div class="lang-switch">
      <button id="btnNL" class="active">NL</button>
      <button id="btnFR">FR</button>
      <button id="btnEN">EN</button>
    </div>
  </div>

  <div class="deck">
    <div class="slide-wrap" id="slideWrap"></div>

    <!-- Navigatie onderaan -->
    <div class="nav nav-bottom">
      <button class="prevBtn">← Vorige</button>
      <div class="dots dots-bottom"></div>
      <div class="counter"><span class="counterValue">1 / 11</span></div>
      <button class="nextBtn">Volgende →</button>
    </div>
  </div>
</div>

let currentLang="nl";
let currentSlide=0;

function renderSlide(data){
  if(data.type==="title"){
    return `<div class="slide title active">
      <div class="title-media">
        <img src="${data.img}" alt="A-count — Remote Office in Sofia">
      </div>
    </div>`;
  }
  if(data.type==="cta"){
    const items=data.items.map(i=>`<li>${i}</li>`).join("");
    return `<div class="slide cta active">
      <div class="eyebrow">A-COUNT</div>
      <h2>${data.title}</h2>
      <ul>${items}</ul>
      <a class="cta-button" href="mailto:mdebuck@gmail.com?subject=BE%2FBG%20business%20development">${data.button}</a>
      <div class="cta-contact">${data.contact}</div>
    </div>`;
  }
  let cls="slide active";
  if(data.type==="why") cls="slide why active";
  if(data.type==="patrimonium") cls="slide patrimonium active";
  const items=data.items.map(i=>`<li>${i}</li>`).join("");
  return `<div class="${cls}">
    <div class="eyebrow">${data.eyebrow}</div>
    <h2>${data.title}</h2>
    <ul>${items}</ul>
    <div class="footer-tag">A-count</div>
  </div>`;
}

function renderDeck(){
  const slides=CONTENT[currentLang];
  document.getElementById("slideWrap").innerHTML=renderSlide(slides[currentSlide]);

  // Update both navigation bars (top and bottom)
  document.querySelectorAll(".dots").forEach(dotsEl=>{
    dotsEl.innerHTML="";
    slides.forEach((_,idx)=>{
      const d=document.createElement("span");
      if(idx===currentSlide)d.classList.add("active");
      d.addEventListener("click",()=>{currentSlide=idx;renderDeck();});
      dotsEl.appendChild(d);
    });
  });

  document.querySelectorAll(".counterValue").forEach(el=>{
    el.textContent=`${currentSlide+1} / ${slides.length}`;
  });

  document.querySelectorAll(".prevBtn").forEach(btn=>{
    btn.disabled=currentSlide===0;
    btn.textContent=NAV_LABELS[currentLang].prev;
  });

  document.querySelectorAll(".nextBtn").forEach(btn=>{
    btn.disabled=currentSlide===slides.length-1;
    btn.textContent=NAV_LABELS[currentLang].next;
  });
}

function setLang(lang){
  // Keep the current slide number when switching language.
  // Example: slide 4 in NL -> slide 4 in FR/EN.
  const previousSlide = currentSlide;
  currentLang = lang;

  // All three language versions have the same number and order of slides.
  // Clamp only as a safety measure in case that ever changes.
  const slides = CONTENT[currentLang];
  currentSlide = Math.min(previousSlide, slides.length - 1);

  document.getElementById("btnNL").classList.toggle("active",lang==="nl");
  document.getElementById("btnFR").classList.toggle("active",lang==="fr");
  document.getElementById("btnEN").classList.toggle("active",lang==="en");
  renderDeck();
}

document.getElementById("btnNL").addEventListener("click",()=>setLang("nl"));
document.getElementById("btnFR").addEventListener("click",()=>setLang("fr"));
document.getElementById("btnEN").addEventListener("click",()=>setLang("en"));
document.querySelectorAll(".prevBtn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(currentSlide>0){currentSlide--;renderDeck();}
  });
});
document.querySelectorAll(".nextBtn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const slides=CONTENT[currentLang];
    if(currentSlide<slides.length-1){currentSlide++;renderDeck();}
  });
});
document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight")document.getElementById("nextBtn").click();
  if(e.key==="ArrowLeft")document.getElementById("prevBtn").click();
});
renderDeck();
</script>
