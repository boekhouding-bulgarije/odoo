<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herman VDM — Accounting &amp; Tax Consulting in Sofia</title>
<link rel="icon" type="image/png" href="https://bkatrpghmzbpjhegvkev.supabase.co/storage/v1/object/public/s/1792727393058-screenshot-1792727393056.png">
<link rel="apple-touch-icon" href="https://bkatrpghmzbpjhegvkev.supabase.co/storage/v1/object/public/s/1792727393058-screenshot-1792727393056.png">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f7f6f2; }
  #site { display: block; width: 100%; height: 100vh; border: 0; }
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #0F4C5C; background: #f7f6f2; text-align: center; padding: 24px;
  }
  #status a { color: #0F4C5C; }
  #status.hidden { display: none; }
</style>
</head>
<body>

<iframe id="site" title="Herman VDM website" allow="fullscreen" allowfullscreen></iframe>

<div id="status">Website laden…</div>

<script>
(function () {
  var SOURCE = "https://bkatrpghmzbpjhegvkev.supabase.co/storage/v1/object/public/s/sandbox/1792727996473-index.html";
  var frame  = document.getElementById("site");
  var status = document.getElementById("status");
  var CLOSE  = "<" + "/script>";

  /* De site gebruikt hash-routes (#/home, #/contact, ...). In een iframe met een
     blob-URL blokkeert de browser history.replaceState (opaque origin), waardoor
     de router stopt en de links niets meer doen. Daarom:
       1. de pagina wordt via srcdoc geladen (deelt de origin van de canvas),
       2. een shim vangt replaceState/pushState-fouten op,
       3. hash-links worden zelf afgehandeld, zodat navigatie altijd werkt. */
  var shim =
    "<script>(function(){" +
      "function safe(fn){return function(){try{return fn.apply(history,arguments);}catch(e){}};}" +
      "try{history.replaceState=safe(history.replaceState);history.pushState=safe(history.pushState);}catch(e){}" +
      "document.addEventListener('click',function(ev){" +
        "var t=ev.target;" +
        "while(t&&t.nodeType===1&&t.tagName!=='A'){t=t.parentNode;}" +
        "if(!t||t.nodeType!==1||t.tagName!=='A')return;" +
        "var href=t.getAttribute('href')||'';" +
        "if(href.charAt(0)!=='#')return;" +
        "if(t.getAttribute('target')==='_blank')return;" +
        "ev.preventDefault();" +
        "if(location.hash===href){" +
          "try{if(typeof route==='function')route();}catch(e){}" +
          "try{window.dispatchEvent(new HashChangeEvent('hashchange'));}catch(e){}" +
        "}else{location.hash=href;}" +
      "},true);" +
    "})();" + CLOSE;

  fetch(SOURCE)
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(function (html) {
      var logo = "https://bkatrpghmzbpjhegvkev.supabase.co/storage/v1/object/public/s/1792727393058-screenshot-1792727393056.png";

      /* Nederlandse homepage-teksten vervangen in de geladen bron. */
      html = html.split("Wil je je bedrijf oprichten in Bulgarije en profiteren van alle voordelen die het land biedt?").join("Ondernemen in een belastingvriendelijk EU-land, met alle fiscale zaken netjes geregeld? Het kan!");
      html = html.split("Het kantoor in Sofia, gespecialiseerd in boekhouding en fiscaal advies voor internationale bedrijven in Bulgarije.").join("Ons kantoor in Sofia begeleidt Belgische bedrijven juridisch, fiscaal en boekhoudkundig bij het oprichten van een filiaal of remote office.");

      /* logo in de header en in de footer, met dezelfde subtiele afgeronde hoeken */
      html = html.replace(/(<a class="brand"[^>]*>\s*<img src=")[^"]+(" alt="Herman VDM">)/, "$1" + logo + "$2");
      html = html.replace(/(<a class="footer-brandline"[^>]*>\s*<img src=")[^"]+(" alt="Herman VDM">)/, "$1" + logo + "$2");
      html = html.replace(/<head([^>]*)>/i, function (m, attrs) {
        return "<head" + attrs + "><style>.brand img,.footer-brandline img{border-radius:6px!important}</style>";
      });

      /* navigatie-shim direct na <head> */
      html = html.replace(/<head([^>]*)>/i, function (m, attrs) { return "<head" + attrs + ">" + shim; });

      frame.srcdoc = html;
      status.classList.add("hidden");
    })
    .catch(function (err) {
      status.innerHTML = "Kon de pagina niet laden (" + err.message + ").<br><br>" +
        '<a href="' + SOURCE + '" target="_blank" rel="noopener">Open het bestand in een nieuw tabblad</a>';
    });
})();
</script>

</body>
</html>
